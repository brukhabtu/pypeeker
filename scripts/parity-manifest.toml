# Parity manifest for the DSL rewrite's differential oracle.
#
# Read ONLY by scripts/differential-check.py. dsl-rewrite.md is normative for
# the program this file serves: it holds the decision, the freeze, and the
# "## Divergence ledger" that is the sole sanctioned way to declare a
# behavioral difference between the old (frozen) check engine and the new
# one. Parity across all 22 rules named there is the precondition for the
# phase-5 flip.
#
# `claimed` lists the rules the new engine currently claims to implement —
# phase 3 appends to this list one rule (or family) at a time as it lands.
# `claimed = []` used to make the harness do no comparison work and pass
# trivially; that was the phase-1 acceptance smoke test. Phase 3 has begun and
# this list is no longer empty, so the only way that state arises now is a
# manifest that did not load or was emptied — which is why the harness now
# treats it as an ERROR (exit 2) rather than a pass. The old trivial pass
# survives only behind `--allow-empty-claim`, for harness self-tests that mean
# to exercise the empty path.
version = 1

claimed = ["born-private", "docstring-drift", "import-boundaries", "naming-conventions", "no-import-cycles", "no-impure-functions", "no-unresolved-refs", "over-exposed-export", "over-exposed-module-symbol", "prefer-tuple", "require-docstrings", "test-only-production-code", "unused-imports", "unused-public-symbol"]

# `born-private` grades 0-vs-0 here, and the zero is load-bearing on both
# sides: the materialized target carries no `.pypeeker/check-baseline.json`, so
# the frozen rule seeds it and returns nothing, and the port's armed gate (see
# `born_private` in dsl/visibility.py) is closed and yields nothing. The
# agreement does NOT depend on which engine runs first — the port reads a
# seeded baseline exactly as the frozen rule does, so an old-first run (the
# seeded branch: every current public symbol recorded, so nothing is new) and a
# new-first run (the unarmed branch) both come out empty. The port still does
# not self-seed; that difference is in effect rather than in output, and is in
# dsl-rewrite.md's ledger. What the oracle cannot show here — the rule actually
# firing, and the seeded-empty-vs-absent distinction — is pinned by
# tests/test_dsl_visibility_rules.py.

# NON-VACUITY AUDIT. A claimed rule that grades 0-vs-0 on every target proves
# only that both engines are silent about it; the oracle cannot tell that apart
# from a port that emits nothing at all. So every entry in `claimed` must have
# EITHER a target where the old engine reports a nonzero count, OR a comment in
# this file naming the unit tests that pin it instead. Counts below are as
# measured when each rule was claimed and will drift as the corpora grow — the
# load-bearing claim is "nonzero somewhere", not the number.
#
#   born-private               unit tests (see the note above `new-engine`)
#   docstring-drift            filelocal (7) — and ONLY there: the rule is in
#                              this repository's gated self-lint set at zero
#                              findings, so target `self` is 0-vs-0 by
#                              construction and will stay that way. Six of the
#                              seven are ghosts and one is a `require-complete`
#                              missing, so both message shapes are graded; two
#                              of the ghosts are on ONE function, which is the
#                              only place the oracle sees the fan-out.
#   import-boundaries          boundaries (13)
#   naming-conventions         filelocal (6) — and ONLY there; the other four
#                              targets are ruff-clean or fixture code that
#                              happens to be snake_case throughout
#   no-import-cycles           cycles (4)
#   no-impure-functions        purity (8)
#   no-unresolved-refs         purity (1)
#   over-exposed-export        self (182)
#   over-exposed-module-symbol every target (self 11, boundaries 5, cycles 13,
#                              filelocal 18, purity 11)
#   prefer-tuple               self (18)
#   require-docstrings         filelocal (3) — and ONLY there; see that
#                              target's comment for why every other target,
#                              this repository included, is structurally 0
#   test-only-production-code  unit tests (see the `[[divergence]]` note at the
#                              bottom of this file)
#   unused-imports             cycles (6), boundaries (2), filelocal (2). The
#                              boundaries pair is the load-bearing one: both
#                              findings are in `src/app/twin/{one,two}.py`,
#                              whose `__init__.py` twins bind the SAME symbol
#                              ids, so a port keying its verdicts on
#                              `symbol_id` reads the barrel half's answer
#                              (skipped) for the module half and reports zero.
#   unused-public-symbol       every target (self 1, boundaries 5, cycles 13,
#                              filelocal 18, purity 11)
#
# Whoever appends to `claimed` extends this list in the same change. There is
# no automated assertion behind it: proving non-vacuity requires a live run of
# both engines, which is this script, not a unit test.

# Argv prefix for the new engine, appended with `--target <materialized dir>
# --rules <comma-joined claimed>`. It must exit 0 and print exactly one JSON
# object on stdout:
#   {"schema": 1, "findings": [{"rule": "...", "path": "src/x.py", "line": 12,
#                                "message": "...", "confidence": "declared"}]}
# `--target` is the SAME directory the old engine just indexed and checked,
# so the new engine may reuse its `.pypeeker/` index and the generated
# `[tool.pypeeker.<rule>]` option tables. The launcher is a script rather than
# `-m pypeeker.dsl.differential` because a `__name__` guard under `src/` fails
# the self-lint gate; the real surface is `pypeeker.dsl.differential.main`.
# The path is relative — `run_new_engine` anchors the new engine's cwd to the
# repo root, the same way `default_old_engine` anchors the old one.
new-engine = ["uv", "run", "python", "scripts/dsl-engine.py"]

# Every claimed rule is graded on every target below. A target must have a
# `[tool.pypeeker]` section in its own pyproject.toml (the harness never
# forces a project that lacks one — see `materialize_target`).
[[target]]
name = "self"
path = "."

# Fixture corpora under tests/fixtures/parity/. pypeeker's own gated self-lint
# keeps several rules at ZERO findings on this repository, so grading them on
# `self` alone compares nothing (0-vs-0) and would let a port that emits
# nothing at all pass. Each fixture is a tiny project carrying real violations
# of one rule family, with that family's option table in its own
# pyproject.toml — `materialize_target` keeps the whole [tool.pypeeker] section
# and only overwrites `rules`, so the options survive and every claimed rule is
# still graded on every corpus. The fixtures are ruff-excluded and are not
# indexed by the self-lint; the oracle is the only thing that reads them.
#
# Each corpus also carries a file whose only job is to be a degenerate case the
# ordinary ones cannot express, because a port can be wrong in a way no
# well-formed project reveals:
#   boundaries/src/app/dup/mod.py + .../mod/__init__.py — two indexed files
#     with ONE module id, so a census that keys its answer on a module id and
#     quantifies per file reports the package twice.
#   boundaries/src/app/twin/{one,two}.py + .../{one,two}/__init__.py — that
#     collision propagated into SYMBOL ids, which are `<module>:<local>`, so two
#     files sharing a module id bind ONE id for the same local name. `two` is
#     the shape where a per-id verdict table emits an extra finding against a
#     file whose imports are all permitted; `one` is the shape where both halves
#     violate for different reasons, so the finding COUNT matches and only the
#     wording is corrupted — the failure a count-based comparison cannot see.
#   cycles/src/cyc/a.py + .../a/__init__.py — the same collision on the module
#     a cycle is charged to. And r/s, t/u, v/w carry deferred-import chains
#     DEEPER than one scope (class in function; class in class at module level;
#     comprehension in a method), which is the only shape that can tell "every
#     enclosing scope" apart from "the immediate scope".
#   purity/src/__init__.py — a source root that is itself a package, so the
#     module path is "" and the symbols have ids like ":impure_root". The
#     `src*` include pattern there is bait for a port matching patterns against
#     a file path.
[[target]]
name = "boundaries"
path = "tests/fixtures/parity/boundaries"

[[target]]
name = "cycles"
path = "tests/fixtures/parity/cycles"

# The cycles corpus deliberately carries NO `allow` option, even though
# `no-import-cycles` has one: `allow` is a list of lists, and this harness's
# minimal TOML writer (`_toml_value`) refuses a nested list and aborts the whole
# run. Working around that by teaching the writer nested lists would be editing
# the grading instrument as part of a port, so the allow-suppression path is
# pinned by unit test instead (tests/test_dsl_rules_cycles.py). Adding the
# branch to `_toml_value`, with its own harness test, is a clean follow-up for
# whoever needs a table-of-lists option graded.

[[target]]
name = "purity"
path = "tests/fixtures/parity/purity"

# The file-local family's corpus. It exists so that family grades
# NON-VACUOUSLY: `require-docstrings` reports zero on every other target, and a
# claimed rule that is 0-vs-0 everywhere proves only that both engines are
# silent. Its distinguishing property is a negative one — the pyproject declares
# NO project-wide `visibility` sub-table of `[tool.pypeeker]`, because
# `check.config` injects that table, when present, into every rule's options
# and `require-docstrings` then coerces it into
# an EMPTY visibility set and reports nothing (the mechanism is documented and
# measured in src/pypeeker/dsl/rules.py:_enum_set, and repeated in the corpus's
# own pyproject.toml so it survives a move). It is an ordinary package under
# `src/flocal/`, deliberately NOT a source root that is itself a package: that
# shape produces files with no MODULE symbol, the one edge dsl-rewrite.md's
# ledger records as unreconciled between `dsl/universes.py`'s `_Env.of` and
# `dsl/columns.py`'s `_modules_by_file`, and a fixture must not be the place
# that edge first gets graded.
#
# It carries the whole file-local family's material, one concern per module:
#   undocumented.py — undocumented public symbols for `require-docstrings`.
#   naming.py       — both `naming-conventions` message shapes and all four
#     label shapes. Reaching the third and fourth needs configuration, so this
#     corpus's pyproject selects the `variable` kind and overrides ONE kind's
#     pattern; see the comment there.
#   imports.py, __init__.py, exported.py, star.py, dynamic.py — one real
#     `unused-imports` finding plus every one of its exclusions: a barrel, an
#     `__all__` binder, a star import, a dynamically recovered import, an
#     underscore-prefixed binding, a dotted import, a `__future__` import, a
#     forward-reference-only import, and a used import. `dynamic.py` exists for
#     the confidence half: it calls `getattr`, so its finding is HEURISTIC, and
#     the harness compares tiers as well as counts.
#   drifted.py      — `docstring-drift`, including the one shape no other rule
#     in the manifest has: `two_ghosts` is a single symbol that must produce
#     TWO findings at the SAME line. A port that quantifies over functions
#     rather than over drifted parameters reports one of them and grades 6-vs-7
#     here; nothing else in any corpus catches that. The module also carries
#     one ghost per recognized docstring style (so autodetection is graded),
#     a method whose `self` must not read as an undocumented parameter, and a
#     docstring with no params section, which must stay silent in BOTH
#     directions. `require-complete = true` in the pyproject is what grades the
#     second message shape at all — with it unset the port switches that whole
#     RulePart off, matching the frozen `if`, and the shape would go unproven.
[[target]]
name = "filelocal"
path = "tests/fixtures/parity/filelocal"

# Declared divergences. Every entry must resolve against dsl-rewrite.md's
# "## Divergence ledger" (whitespace-normalized substring match on `ledger`)
# and against a rule already in `claimed` above — a divergence for an
# unclaimed rule can only be stale. Two kinds only:
#
#   kind = "message" — drop `message` from the comparison key for `rule`.
#     Sanctioned by fork #6/#13 (message wording is freely improvable). Takes
#     no `side`/`path`/`line`/`message`: the sanction is rule-wide, so a key
#     that reads as narrowing it to one wording is refused by name rather
#     than accepted and ignored.
#   kind = "finding" — a named finding (`rule`, `path`, `line`, optional
#     `message`) expected on exactly one `side` ("old" or "new"); removed
#     from that side before comparison.
#
# There is deliberately NO "confidence" divergence kind: dsl-rewrite.md's
# ledger is explicit that a port meeting `prefer-tuple` down to INFERRED is
# wrong, not divergent, and a relaxation knob would let exactly that bug be
# declared away.
#
# Example (all fields shown; not real — uncomment and adapt when phase 3
# needs one):
# [[divergence]]
# rule = "prefer-tuple"
# kind = "finding"
# side = "old"
# path = "src/pypeeker/example.py"
# line = 42
# message = "example message text"
# target = "self"
# ledger = "substring that must appear in dsl-rewrite.md's Divergence ledger"

# The ported rule drops the trailing "(N test references)" count: a count is
# an aggregate over the reference set, not a field of the row a message
# template renders. Rule-wide, per forks #6/#13. It grades nothing today —
# the rule reports zero findings on target `self`, whose materialized copy
# holds only `src/` and therefore no test path — so the exact new wording is
# pinned by tests/test_dsl_visibility_rules.py instead.
[[divergence]]
rule = "test-only-production-code"
kind = "message"
target = "self"
ledger = "`test-only-production-code` message drops the reference count"
