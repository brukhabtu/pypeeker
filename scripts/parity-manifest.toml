# Parity manifest for the DSL rewrite's differential oracle.
#
# Read ONLY by scripts/differential-check.py. dsl-rewrite.md is normative for
# the program this file serves: it holds the decision, the freeze, and the
# "## Divergence ledger" that is the sole sanctioned way to declare a
# behavioral difference between the old (frozen) check engine and the new
# one. Parity across all 22 rules named there is the precondition for the
# phase-5 flip.
#
# `claimed` lists the rules the new engine currently claims to implement —
# phase 3 appends to this list one rule (or family) at a time as it lands.
# `claimed = []` used to make the harness do no comparison work and pass
# trivially; that was the phase-1 acceptance smoke test. Phase 3 has begun and
# this list is no longer empty, so the only way that state arises now is a
# manifest that did not load or was emptied — which is why the harness now
# treats it as an ERROR (exit 2) rather than a pass. The old trivial pass
# survives only behind `--allow-empty-claim`, for harness self-tests that mean
# to exercise the empty path.
version = 1

claimed = ["barrel-only", "born-private", "docstring-drift", "import-boundaries", "import-time-side-effects", "naming-conventions", "no-argument-mutation", "no-hidden-global-mutation", "no-import-cycles", "no-impure-functions", "no-unresolved-refs", "over-exposed-export", "over-exposed-module-symbol", "prefer-tuple", "pure-decorator-contracts", "require-docstrings", "star-imports", "test-only-production-code", "under-exposed-access", "unused-imports", "unused-public-symbol", "unused-return-value"]

# `born-private` grades 0-vs-0 here, and the zero is load-bearing on both
# sides: the materialized target carries no `.pypeeker/check-baseline.json`, so
# the frozen rule seeds it and returns nothing, and the port's armed gate (see
# `born_private` in dsl/visibility.py) is closed and yields nothing. The
# agreement does NOT depend on which engine runs first — the port reads a
# seeded baseline exactly as the frozen rule does, so an old-first run (the
# seeded branch: every current public symbol recorded, so nothing is new) and a
# new-first run (the unarmed branch) both come out empty. The port still does
# not self-seed; that difference is in effect rather than in output, and is in
# dsl-rewrite.md's ledger. What the oracle cannot show here — the rule actually
# firing, and the seeded-empty-vs-absent distinction — is pinned by
# tests/test_dsl_visibility_rules.py.

# NON-VACUITY AUDIT. A claimed rule that grades 0-vs-0 on every target proves
# only that both engines are silent about it; the oracle cannot tell that apart
# from a port that emits nothing at all. So every entry in `claimed` must have
# EITHER a target where the old engine reports a nonzero count, OR a comment in
# this file naming the unit tests that pin it instead. Counts below are as
# measured when each rule was claimed and will drift as the corpora grow — the
# load-bearing claim is "nonzero somewhere", not the number.
#
#   barrel-only                crossfile (2) — and ONLY there. The rule is in
#                              this repository's gated self-lint set at zero
#                              findings, so target `self` is 0-vs-0 by
#                              construction and always will be; every other
#                              corpus predates the rule and has no curated
#                              `__all__` barrel to deep-import past. Both
#                              findings are in `src/xf/api/handler.py`, and the
#                              second is an ALIASED deep import
#                              (`from xf.core.engine import helper as
#                              core_helper`), which is the only shape that
#                              grades the message quoting the name the barrel
#                              exports rather than the consumer's local alias.
#                              The five exemptions are exercised in the same
#                              file and graded as silence; the dynamic-import
#                              exemption, which no source file can produce at
#                              the right shape, is pinned by
#                              tests/test_dsl_rules_crossfile.py.
#   born-private               unit tests (see the note above `new-engine`)
#   docstring-drift            filelocal (7) — and ONLY there: the rule is in
#                              this repository's gated self-lint set at zero
#                              findings, so target `self` is 0-vs-0 by
#                              construction and will stay that way. Six of the
#                              seven are ghosts and one is a `require-complete`
#                              missing, so both message shapes are graded; two
#                              of the ghosts are on ONE function, which is the
#                              only place the oracle sees the fan-out.
#   import-boundaries          boundaries (13)
#   import-time-side-effects   impurity (11) — and ONLY there. The rule is in
#                              this repository's gated self-lint set at zero
#                              findings, so target `self` is 0-vs-0 BY
#                              CONSTRUCTION and always will be; the other six
#                              corpora predate the rule and were measured at
#                              zero on it before this target existed, so
#                              without `impurity` the rule would be claimed and
#                              graded nowhere. All three call shapes fire
#                              there, both confidence tiers on the builtin arm
#                              (`print`/`quit` DECLARED, the `extra-impure`
#                              bare `log` HEURISTIC because it never resolved),
#                              the qualified arm three ways (plain import root,
#                              two-segment chain, from-import root), and the
#                              project arm on both a FUNCTION and a METHOD so
#                              the one varying word of its message is graded.
#                              `Maker.build()` grades the frozen `elif`'s
#                              FALL-THROUGH — a qualified name that misses the
#                              denylist must continue into shape 3, not end.
#                              Both `allow` branches (call name, module path)
#                              and all three `extra-impure` kinds are graded as
#                              silence and as findings respectively, each
#                              verified load-bearing by removal. The frozen
#                              DEFAULT_ALLOW is graded too, and only because
#                              the corpus names `logging.getLogger` in
#                              `extra-impure`: that makes the call impure by
#                              configuration, so its silence can only come from
#                              DEFAULT_ALLOW beating the configured list. A
#                              port that dropped or typo'd that entry reports
#                              12 against the frozen 11.
#   naming-conventions         filelocal (6) — and ONLY there; the other six
#                              targets are ruff-clean or fixture code that
#                              happens to be snake_case throughout
#   no-argument-mutation       self (150: 71 mutator-call, 74 attribute-write,
#                              5 subscript), mutation (10). The `self` count is
#                              large because the rule quantifies over mutation
#                              SITES; it moves with the source. The rule is NOT
#                              in this repository's gated self-lint set and
#                              must not be added to it — 150 findings would
#                              turn the zero-baseline gate red. `mutation` is
#                              where the wording is graded: the METHOD-kind
#                              message, the two-segment receiver chain, the
#                              `allow` id glob and the `extra-mutators` option
#                              exist only there.
#   no-hidden-global-mutation  self (5, all shape 1a, all registry `_decorate`
#                              closures), mutation (9) — the only target where
#                              the rebind (1b), module-container (2) and
#                              imported-module (3) shapes fire at all, and the
#                              only one grading either `allow` branch or
#                              `extra-mutators`.
#   no-import-cycles           cycles (4)
#   no-impure-functions        purity (8)
#   no-unresolved-refs         purity (1), impurity (2)
#   over-exposed-export        self (202 — nine are the phase-3e names added
#                              to `dsl`'s barrel and four the phase-3f ones;
#                              the count moves with the barrel by design)
#   over-exposed-module-symbol every target (self 9, boundaries 5, crossfile 9,
#                              cycles 13, filelocal 18, impurity 13,
#                              mutation 23, purity 11)
#   prefer-tuple               self (19 — one is phase-3e's own
#                              `_global_rebind_sweep` in dsl/sweeps.py)
#   pure-decorator-contracts   impurity (11) — and ONLY there, for the same
#                              reason: the rule is in this repository's gated
#                              self-lint set at zero findings, so target `self`
#                              is 0-vs-0 BY CONSTRUCTION, and every other
#                              corpus predates the rule and measures zero. The
#                              target grades the decorator contract in four
#                              spellings (bare `@cache`, a called and dotted
#                              `@functools.lru_cache(maxsize=None)` whose
#                              message quotes the head AS WRITTEN, `@property`,
#                              `@cached_property`), the dunder contract with no
#                              `@` prefix, the decorator-beats-dunder rule (an
#                              `@property`-decorated `__len__` reported ONCE,
#                              as `@property`), a module-level `def __eq__`
#                              that must stay silent because the dunder arm is
#                              METHOD-only, the `+N more` truncation tail, a
#                              line-less `TransitiveImpureCall` observation,
#                              and the HEURISTIC tier — which needs a receiver
#                              the binder cannot classify, so the fixture calls
#                              through a chained expression; binding the
#                              receiver to a local would make it VARIABLE and
#                              silently turn the only HEURISTIC grading
#                              DECLARED. The `allow` id glob and both option
#                              supersets are graded there too.
#   require-docstrings         filelocal (3) — and ONLY there; see that
#                              target's comment for why every other target,
#                              this repository included, is structurally 0
#   star-imports               crossfile (5), filelocal (1). The rule is
#                              delegated to ruff (F403) in this repository's
#                              gate and never enabled here, so `self` is 0-vs-0
#                              by construction. All FOUR message shapes and
#                              BOTH confidence tiers are graded on crossfile:
#                              `user.py` is the lone-star DECLARED plural, and
#                              `empty.py` the lone-star DECLARED zero-names
#                              line; `multi.py` carries two stars, so both its
#                              findings are HEURISTIC and they are also the only
#                              place first-star-wins attribution is observable
#                              (`ALPHA` goes to the first star, `gamma` to the
#                              second); `unknown.py` targets `os.path`, which is
#                              outside the corpus, so it takes the
#                              not-indexed branch — the one case where the
#                              file's star count does NOT decide the tier. The
#                              filelocal finding is the same zero-names line and
#                              predates this target. The underscore and
#                              `<unresolved>.attr` exclusions from attribution,
#                              and the absent remedy (a ledger divergence the
#                              oracle cannot see), are pinned by
#                              tests/test_dsl_rules_crossfile.py.
#   test-only-production-code  unit tests (see the `[[divergence]]` note at the
#                              bottom of this file)
#   under-exposed-access       self (78), crossfile (4) — the only rule here
#                              that quantifies over reference SITES, so the
#                              count is large and moves with the source. Both
#                              message shapes are graded on both targets: the
#                              materialized target holds only `src/`, but the
#                              eight-pattern default globs this rule ships
#                              include `*/test_*.py`, and
#                              `src/pypeeker/check/builtin/test_only_production_code.py`
#                              matches, so the "accessed from tests" wording
#                              fires there — 8 of the 78, the rest production
#                              reach-ins. crossfile grades the `allow` option
#                              too (`_exempt_fn` is reached from another module
#                              and stays silent only because of it), and the
#                              PRIVATE-vs-PROTECTED wording side by side. A
#                              custom `test-globs` is pinned by
#                              tests/test_dsl_crossfile_rules.py.
#   unused-imports             cycles (6), boundaries (2), filelocal (2). The
#                              boundaries pair is the load-bearing one: both
#                              findings are in `src/app/twin/{one,two}.py`,
#                              whose `__init__.py` twins bind the SAME symbol
#                              ids, so a port keying its verdicts on
#                              `symbol_id` reads the barrel half's answer
#                              (skipped) for the module half and reports zero.
#   unused-public-symbol       every target (self 1, boundaries 5, crossfile 9,
#                              cycles 13, filelocal 18, impurity 11,
#                              mutation 23, purity 11)
#   unused-return-value        self (11), crossfile (1), impurity (1).
#                              crossfile's single
#                              finding is the load-bearing one for the message:
#                              `discarded` has FOUR discarding call sites, so it
#                              is the only place the oracle grades the
#                              `+N more` tail that truncates the site list at
#                              three. Its `allow` option is graded there too
#                              (`exempt_producer` is discarded everywhere and
#                              silent only because of it), alongside a `-> None`
#                              procedure and an unannotated function that must
#                              never become candidates. Both quoted `-> None`
#                              spellings, the escape-as-a-value skip and the
#                              zero-call-sites skip are pinned by
#                              tests/test_dsl_crossfile_rules.py.
#
# Whoever appends to `claimed` extends this list in the same change. There is
# no automated assertion behind it: proving non-vacuity requires a live run of
# both engines, which is this script, not a unit test.

# Argv prefix for the new engine, appended with `--target <materialized dir>
# --rules <comma-joined claimed>`. It must exit 0 and print exactly one JSON
# object on stdout:
#   {"schema": 1, "findings": [{"rule": "...", "path": "src/x.py", "line": 12,
#                                "message": "...", "confidence": "declared"}]}
# `--target` is the SAME directory the old engine just indexed and checked,
# so the new engine may reuse its `.pypeeker/` index and the generated
# `[tool.pypeeker.<rule>]` option tables. The launcher is a script rather than
# `-m pypeeker.dsl.differential` because a `__name__` guard under `src/` fails
# the self-lint gate; the real surface is `pypeeker.dsl.differential.main`.
# The path is relative — `run_new_engine` anchors the new engine's cwd to the
# repo root, the same way `default_old_engine` anchors the old one.
new-engine = ["uv", "run", "python", "scripts/dsl-engine.py"]

# Every claimed rule is graded on every target below. A target must have a
# `[tool.pypeeker]` section in its own pyproject.toml (the harness never
# forces a project that lacks one — see `materialize_target`).
[[target]]
name = "self"
path = "."

# Fixture corpora under tests/fixtures/parity/. pypeeker's own gated self-lint
# keeps several rules at ZERO findings on this repository, so grading them on
# `self` alone compares nothing (0-vs-0) and would let a port that emits
# nothing at all pass. Each fixture is a tiny project carrying real violations
# of one rule family, with that family's option table in its own
# pyproject.toml — `materialize_target` keeps the whole [tool.pypeeker] section
# and only overwrites `rules`, so the options survive and every claimed rule is
# still graded on every corpus. The fixtures are ruff-excluded and are not
# indexed by the self-lint; the oracle is the only thing that reads them.
#
# Each corpus also carries a file whose only job is to be a degenerate case the
# ordinary ones cannot express, because a port can be wrong in a way no
# well-formed project reveals:
#   boundaries/src/app/dup/mod.py + .../mod/__init__.py — two indexed files
#     with ONE module id, so a census that keys its answer on a module id and
#     quantifies per file reports the package twice.
#   boundaries/src/app/twin/{one,two}.py + .../{one,two}/__init__.py — that
#     collision propagated into SYMBOL ids, which are `<module>:<local>`, so two
#     files sharing a module id bind ONE id for the same local name. `two` is
#     the shape where a per-id verdict table emits an extra finding against a
#     file whose imports are all permitted; `one` is the shape where both halves
#     violate for different reasons, so the finding COUNT matches and only the
#     wording is corrupted — the failure a count-based comparison cannot see.
#   cycles/src/cyc/a.py + .../a/__init__.py — the same collision on the module
#     a cycle is charged to. And r/s, t/u, v/w carry deferred-import chains
#     DEEPER than one scope (class in function; class in class at module level;
#     comprehension in a method), which is the only shape that can tell "every
#     enclosing scope" apart from "the immediate scope".
#   purity/src/__init__.py — a source root that is itself a package, so the
#     module path is "" and the symbols have ids like ":impure_root". The
#     `src*` include pattern there is bait for a port matching patterns against
#     a file path.
[[target]]
name = "boundaries"
path = "tests/fixtures/parity/boundaries"

[[target]]
name = "cycles"
path = "tests/fixtures/parity/cycles"

# The cycles corpus deliberately carries NO `allow` option, even though
# `no-import-cycles` has one: `allow` is a list of lists, and this harness's
# minimal TOML writer (`_toml_value`) refuses a nested list and aborts the whole
# run. Working around that by teaching the writer nested lists would be editing
# the grading instrument as part of a port, so the allow-suppression path is
# pinned by unit test instead (tests/test_dsl_rules_cycles.py). Adding the
# branch to `_toml_value`, with its own harness test, is a clean follow-up for
# whoever needs a table-of-lists option graded.

[[target]]
name = "purity"
path = "tests/fixtures/parity/purity"

# The file-local family's corpus. It exists so that family grades
# NON-VACUOUSLY: `require-docstrings` reports zero on every other target, and a
# claimed rule that is 0-vs-0 everywhere proves only that both engines are
# silent. Its distinguishing property is a negative one — the pyproject declares
# NO project-wide `visibility` sub-table of `[tool.pypeeker]`, because
# `check.config` injects that table, when present, into every rule's options
# and `require-docstrings` then coerces it into
# an EMPTY visibility set and reports nothing (the mechanism is documented and
# measured in src/pypeeker/dsl/rules.py:_enum_set, and repeated in the corpus's
# own pyproject.toml so it survives a move). It is an ordinary package under
# `src/flocal/`, deliberately NOT a source root that is itself a package: that
# shape produces files with no MODULE symbol, the one edge dsl-rewrite.md's
# ledger records as unreconciled between `dsl/universes.py`'s `_Env.of` and
# `dsl/columns.py`'s `_modules_by_file`, and a fixture must not be the place
# that edge first gets graded.
#
# It carries the whole file-local family's material, one concern per module:
#   undocumented.py — undocumented public symbols for `require-docstrings`.
#   naming.py       — both `naming-conventions` message shapes and all four
#     label shapes. Reaching the third and fourth needs configuration, so this
#     corpus's pyproject selects the `variable` kind and overrides ONE kind's
#     pattern; see the comment there.
#   imports.py, __init__.py, exported.py, star.py, dynamic.py — one real
#     `unused-imports` finding plus every one of its exclusions: a barrel, an
#     `__all__` binder, a star import, a dynamically recovered import, an
#     underscore-prefixed binding, a dotted import, a `__future__` import, a
#     forward-reference-only import, and a used import. `dynamic.py` exists for
#     the confidence half: it calls `getattr`, so its finding is HEURISTIC, and
#     the harness compares tiers as well as counts.
#   drifted.py      — `docstring-drift`, including the one shape no other rule
#     in the manifest has: `two_ghosts` is a single symbol that must produce
#     TWO findings at the SAME line. A port that quantifies over functions
#     rather than over drifted parameters reports one of them and grades 6-vs-7
#     here; nothing else in any corpus catches that. The module also carries
#     one ghost per recognized docstring style (so autodetection is graded),
#     a method whose `self` must not read as an undocumented parameter, and a
#     docstring with no params section, which must stay silent in BOTH
#     directions. `require-complete = true` in the pyproject is what grades the
#     second message shape at all — with it unset the port switches that whole
#     RulePart off, matching the frozen `if`, and the shape would go unproven.
[[target]]
name = "filelocal"
path = "tests/fixtures/parity/filelocal"

# The cross-file residue's corpus (phase 3d). Two of the four rules that family
# covers are STRUCTURALLY 0-vs-0 on target `self` and always will be:
# `barrel-only` is in this repository's gated self-lint set at zero findings,
# and `star-imports` is delegated to ruff's F403 and never enabled here. A rule
# that is 0-vs-0 on every target proves only that both engines are silent, so
# this corpus exists to make those two grade at all — and it re-grades the
# other two on shapes `self` does not have.
#
# One package per concern, and every exemption is present as *silence the
# oracle compares*, not just as a unit test:
#   core/ + plain/ + api/ — `barrel-only`. `core` is a CURATED barrel (declares
#     `__all__`); `plain` re-exports but declares none, so it is uncurated and a
#     deep import past it is clean. `api/handler.py` carries both violations and
#     all five exemptions in one file: a barrel-level import, a deep import of a
#     name the barrel does not re-export (`core/internal.py`), a deep import
#     into the uncurated package, a same-package sibling, and — the one that
#     pins the wording — an ALIASED violating import, `from xf.core.engine
#     import helper as core_helper`, which must be worded `import 'helper'`
#     (what the barrel exports) and not `import 'core_helper'`. A port
#     publishing `symbol.name` on its rows passes every other case here and
#     fails only that one.
#   stars/ — all four `star-imports` message shapes and both confidence tiers.
#     `multi.py` is the degenerate case: two stars in one file, which is
#     simultaneously the HEURISTIC tier, the first-star-wins attribution order
#     (a port attributing last-wins swaps `ALPHA` and `gamma` between two
#     findings that a count-based check cannot tell apart), and the singular
#     "1 name" wording. `unknown.py` targets `os.path`, outside the corpus.
#   reach/ + tests/ — `under-exposed-access` on shapes `self` lacks: a PRIVATE
#     (`__deep_fn`, two leading underscores and no trailing pair) and a
#     PROTECTED target side by side, a configured `allow` pattern, a same-module
#     reach that must stay silent, a public target that must stay silent, and
#     `tests/probe.py`, whose path matches the rule's default `*/tests/*` glob
#     so the second wording fires. That file is `probe.py` and not
#     `test_probe.py` deliberately: pytest's own collection would import a
#     `test_*.py` living under `tests/fixtures/`, and a corpus the oracle reads
#     must not also be a test module.
#   ret/ — `unused-return-value` with FOUR discarding call sites on one
#     function, which is the only place any corpus grades the message's
#     `+N more` truncation tail, plus a configured `allow`, a `-> None`
#     procedure and an unannotated function.
[[target]]
name = "crossfile"
path = "tests/fixtures/parity/crossfile"

# The mutation pair's corpus (phase 3e). Both rules are advisory and opt-in, so
# neither is in this repository's gated self-lint set — but both fire on `self`
# anyway (150 and 5), which is unusual here and means the port is graded on
# real code as well as on fixture code. What `self` does NOT have is any of the
# configuration or three of the four global shapes, and that is what this
# corpus is for.
#
# One module per concern:
#   support.py  — the shapes the rest of the corpus mutates. `Config` carries
#     two mutable attributes so a TWO-segment receiver chain resolves, which is
#     the only place the `via` wording (`options.update()`, root dropped) is
#     graded against a single-segment one.
#   args.py     — all three `no-argument-mutation` shapes, plus `Box.absorb`,
#     a METHOD-kind finding whose message must say "method" and not "function",
#     plus `Box.keep`, whose `self` mutation must stay silent, plus `bump`,
#     whose `n += 1` the frozen rule words as "subscript write". That wording
#     looks wrong and is frozen; the fixture pins it so a well-meaning fix to
#     the template fails the oracle rather than shipping.
#   gstate.py   — all four `no-hidden-global-mutation` shapes: 1a as both an
#     augmented assignment and a subscript store, 1b as a `global` rebind
#     (whose symbol is shadowed, `COUNTER$2`, so `strip_shadow` is graded), 2
#     on a module-level list, and 3 twice — once through `os.environ[...] = v`,
#     which the binder records as an attribute write, and once where the
#     imported module's dotted name differs from the local binding, which is
#     the only place `imported_from`-beats-`name` is observable. `Registry.
#     register` is the METHOD whose message must still say "function".
#   allowed.py  — `extra-mutators` on both rules (`enqueue` is not in the
#     shared collection-mutation table, so both findings exist only because of
#     the option) and the argument rule's exact-id `allow`.
#   silent.py   — one function silenced by an id GLOB for one rule and by the
#     MODULE-PATH branch of `_matches_any` for the other, in one line each, so
#     both `allow` predicates are graded as silence.
#   edges.py    — which function a mutation is charged to, as four positives
#     and one negative: a nested def (charged to the nested def), a
#     comprehension body and a class body defined inside a function (both
#     charged to the function, because the frozen subtree walk descends into
#     them), a nested `global` rebind (charged to the inner function by the
#     innermost-span tiebreak) — and `make_appender`, whose mutation is inside
#     a LAMBDA body and must produce NOTHING. That last one is the degenerate
#     case: a lambda scope owns no FUNCTION/METHOD symbol, so no frozen
#     `AnalysisContext` subtree contains the reference, and a port that treats
#     "innermost enclosing scope" as "innermost enclosing function" fires there
#     while the frozen engine is silent.
[[target]]
name = "mutation"
path = "tests/fixtures/parity/mutation"

# The impurity pair's corpus (phase 3f). BOTH rules are in this repository's
# gated self-lint set at zero findings, so target `self` is 0-vs-0 for them by
# construction and always will be — and, measured before this corpus existed,
# so is every other target: the frozen engine reports ZERO
# `pure-decorator-contracts` and ZERO `import-time-side-effects` findings on
# all seven of them. A corpus was therefore mandatory rather than optional;
# without one the pair would be claimed and graded nowhere.
#
# One module per concern:
#   support.py   — the helpers everything else calls, and two of them are
#     load-bearing in a way that is easy to "clean up" and lose. `chained` is
#     impure ONLY through `now`, so its caller's single observation is a
#     `TransitiveImpureCall` — the one observation kind that is about a callee
#     rather than a site and therefore renders with NO ` (line N)` suffix.
#     `make_handle`'s purity is NOT load-bearing, measured both ways: inserting
#     `time.time()` into it leaves `cached_opaque`'s finding byte-identical,
#     because chaining off the call keeps that call reference from contributing
#     an observation of its own. What carries the HEURISTIC tier is solely the
#     inline chain in `cached_opaque`, below.
#   contracts.py — all eleven `pure-decorator-contracts` findings and its four
#     silences. `cached_stamp` carries `@functools.lru_cache(maxsize=None)`,
#     whose message must quote the head AS WRITTEN (parentheses stripped,
#     module prefix kept), so a port normalizing it to `@lru_cache` fails here
#     and nowhere else. `cached_pile` has FOUR observations, the only place any
#     corpus grades the `+N more` truncation on this rule. `cached_opaque`
#     writes `make_handle().write("x")` INLINE: chaining off a call breaks the
#     receiver chain and yields `ReceiverKind.UNKNOWN`, which is the entire
#     HEURISTIC tier here — binding the handle to a local first makes the
#     receiver a VARIABLE and reports DECLARED, so a readability edit to that
#     one line silently drops the tier. `Box.__len__` is decorated `@property`
#     AND a contract dunder and must be reported ONCE, as `@property`, because
#     the frozen `_contract_for` returns on the first matching decorator; a
#     port checking both grades 12-vs-11. The module-level `def __eq__` is a
#     FUNCTION, not a METHOD, and is the only thing separating "the name is a
#     configured dunder" from "a METHOD whose name is one". `Exempt` is
#     silenced by the id glob, `Box.name` is a pure `@property` and
#     `Box.refresh` is impure but under no contract at all.
#   settings.py  — two ordinary findings (one builtin, one module call) that
#     match no call-name pattern and are silent ONLY through the MODULE-PATH
#     branch of the frozen `_allowed`.
#   importtime.py — all eleven `import-time-side-effects` findings and its four
#     silences, covering all three shapes of the frozen `_describe_call` and
#     both confidence tiers on the builtin arm: `print` / `quit` resolve to
#     builtins and report DECLARED, while the unresolved bare `log` — a finding
#     only because `extra-impure` names it — reports HEURISTIC. Shape 2 appears
#     three ways: a plain import root (`subprocess.run`), a TWO-segment
#     receiver chain (`os.path.exists`), and the same dotted name assembled
#     from a FROM-import root (`from os import path`, so `imported_from` beats
#     the local binding). `Maker.build()` grades the frozen `elif`'s
#     FALL-THROUGH: its qualified name assembles to `impure.support.build`,
#     which misses the denylist, so classification must continue into shape 3
#     rather than end. The class body and the module-level comprehension are
#     the two scope kinds that still run during an import; `deferred`'s body
#     and the class nested inside `outer` are the two that do not. The
#     `logging.getLogger` line is the one silence that grades a frozen CONSTANT
#     rather than a configured option: it is named in `extra-impure`, so it is
#     impure by configuration and the only thing suppressing it is DEFAULT_ALLOW
#     taking precedence over the configured list.
#
# Every option in this corpus's pyproject is graded, and verified load-bearing
# by removing it: without `decorators`/`dunders` the `@memoize` and `__bool__`
# findings vanish, without `extra-impure` the `shelve.open`, `log` and
# `logging.getLogger` findings vanish (the last of these only once DEFAULT_ALLOW
# is also removed, which is the point of the pairing), and without either
# `allow` list four suppressed findings come back.
[[target]]
name = "impurity"
path = "tests/fixtures/parity/impurity"

# Declared divergences. Every entry must resolve against dsl-rewrite.md's
# "## Divergence ledger" (whitespace-normalized substring match on `ledger`)
# and against a rule already in `claimed` above — a divergence for an
# unclaimed rule can only be stale. Two kinds only:
#
#   kind = "message" — drop `message` from the comparison key for `rule`.
#     Sanctioned by fork #6/#13 (message wording is freely improvable). Takes
#     no `side`/`path`/`line`/`message`: the sanction is rule-wide, so a key
#     that reads as narrowing it to one wording is refused by name rather
#     than accepted and ignored.
#   kind = "finding" — a named finding (`rule`, `path`, `line`, optional
#     `message`) expected on exactly one `side` ("old" or "new"); removed
#     from that side before comparison.
#
# There is deliberately NO "confidence" divergence kind: dsl-rewrite.md's
# ledger is explicit that a port meeting `prefer-tuple` down to INFERRED is
# wrong, not divergent, and a relaxation knob would let exactly that bug be
# declared away.
#
# Example (all fields shown; not real — uncomment and adapt when phase 3
# needs one):
# [[divergence]]
# rule = "prefer-tuple"
# kind = "finding"
# side = "old"
# path = "src/pypeeker/example.py"
# line = 42
# message = "example message text"
# target = "self"
# ledger = "substring that must appear in dsl-rewrite.md's Divergence ledger"

# The ported rule drops the trailing "(N test references)" count: a count is
# an aggregate over the reference set, not a field of the row a message
# template renders. Rule-wide, per forks #6/#13. It grades nothing today —
# the rule reports zero findings on target `self`, whose materialized copy
# holds only `src/` and therefore no test path — so the exact new wording is
# pinned by tests/test_dsl_visibility_rules.py instead.
[[divergence]]
rule = "test-only-production-code"
kind = "message"
target = "self"
ledger = "`test-only-production-code` message drops the reference count"
