name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Frozen oracle paths (DSL rewrite)
        if: github.event_name == 'pull_request'
        run: ./scripts/check-frozen-paths.sh "origin/${{ github.base_ref }}"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -q

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Self-lint (pypeeker)
        run: |
          uv run pypeeker index src
          uv run pypeeker check

      - name: Differential oracle (DSL rewrite)
        run: uv run python scripts/differential-check.py
