[project]
name = "pypeeker"
version = "0.1.0"
description = "Semantic code intelligence CLI for Python"
requires-python = ">=3.14"
dependencies = [
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-python>=0.23",
    "click>=8.1",
]

[project.scripts]
pypeeker = "pypeeker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pypeeker"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
# Test fixtures intentionally contain unused imports, undefined names, etc.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# Conservative selection: pycodestyle errors/warnings + pyflakes.
# Import sorting (I) and pyupgrade (UP) are candidate follow-ups once the
# existing findings are cleaned up.
select = ["E", "F", "W", "N", "D101", "D102", "D103"]
# Long lines not enforced; N818 (Error suffix on exceptions) not enforced
# (matches the prior naming-conventions scope).
ignore = ["E501", "N818"]

[tool.ruff.lint.per-file-ignores]
# Docstring-presence (D) is enforced on src only, matching require-docstrings.
"tests/**" = ["D101", "D102", "D103"]
# Imports after the rule-registration docstring/setup are deliberate.
"src/pypeeker/check/builtin/__init__.py" = ["E402"]
# Deliberate constructs exercised by the tests themselves.
"tests/test_binder.py" = ["F841"]
"tests/test_planner.py" = ["F841"]
"tests/test_purity.py" = ["E702"]
"tests/test_purity_self.py" = ["E702"]
"tests/test_purity_typed_receivers.py" = ["E702"]

[tool.pypeeker]
src = ["src"]
# pypeeker gates itself on every rule whose findings are unambiguous — a real
# bug or hygiene problem — with ZERO findings on this codebase, so plain
# `pypeeker check` hard-gates with no baseline. The remaining builtin rules are
# deliberately NOT gated here because their findings on pypeeker are advisory,
# architectural, or intrinsically stateful rather than defects; the per-rule
# reason for each is in architecture.md -> "Self-lint rule adoption". They stay
# available for consumer projects to enable. This is a curated gate set, not a
# baseline: a new finding from any rule below is a real regression, never
# grandfathered.
# unused-imports (ruff F401), star-imports (F403/F405), naming-conventions
# (N8xx), and require-docstrings (D101-D103) are intentionally NOT gated here:
# ruff — already run in CI and the pre-commit hook — catches them exactly, so
# gating them in pypeeker too is pure duplication. They remain available as
# builtin rules for consumer projects that don't run ruff. The rules below are
# the ones ruff cannot express (cross-module resolution, purity, visibility,
# boundary/cycle analysis).
rules = [
    "no-unresolved-refs",
    "import-boundaries",
    "barrel-only",
    "import-time-side-effects",
    "docstring-drift",
    "pure-decorator-contracts",
    "test-only-production-code",
    "no-import-cycles",
    "no-impure-functions",
    "unused-public-symbol",
    "over-exposed-module-symbol",
]

# Click commands/groups are reached by framework name, not by reference:
# renaming the function would rename the user-facing CLI command. Exempts
# them from the visibility-shaped rules (found by the `pypeeker privatize`
# dogfood, TASK-97).
[tool.pypeeker.visibility]
allow-decorators = ["main.command", "main.group", "transactions.command"]

# Cross-package imports must go through a package's public `__init__` barrel
# (when it has a curated `__all__` one) rather than deep-importing an internal
# submodule. Same `root` as import-boundaries; read from this rule's own table
# because the engine hands each rule only its own options subsection.
[tool.pypeeker.barrel-only]
root = "pypeeker"

# Enforced package layering. Each key is a top-level package under `pypeeker`;
# its value lists the packages it may import. Packages omitted here (e.g. the
# `cli` composition root) are unconstrained. See architecture.md.
[tool.pypeeker.import-boundaries]
root = "pypeeker"
# Every top-level unit under `pypeeker` must be declared below or listed as
# unconstrained; a new undeclared package fails `check` (strict mode). `cli`
# is the composition root and is deliberately unconstrained.
strict = true
unconstrained = ["cli"]
# Flag allow-list entries that no real import exercises, so the layering table
# doesn't rot as dependencies are removed.
report-unused-allowances = true

[tool.pypeeker.import-boundaries.allow]
models = []
paths = []
project = []
adapters = ["models"]
binder = ["adapters", "models", "paths"]
storage = ["models"]
resolve = ["models"]
treebuild = ["models", "storage", "paths"]
check = ["models", "project", "storage", "resolve", "treebuild", "analysis", "query"]
query = ["models", "storage", "treebuild", "resolve"]
analysis = ["models", "storage", "query", "resolve"]
indexer = ["adapters", "binder", "paths", "project", "storage"]
refactor = ["adapters", "analysis", "binder", "models", "paths", "project", "query", "storage"]
app = ["check", "models", "refactor", "storage"]

